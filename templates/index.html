<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ИИ-ассистент Райтек</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #0a0a0a;
    --ink-line: #262624;
    --ink-muted: #8f8d87;
    --paper: #faf9f7;
    --surface: #f0efea;
    --line: #e2e0d9;
    --text: #171614;
    --text-muted: #78766f;
    --accent: #3b4cf0;
    --accent-soft: #e8eafe;
    --success: #1f9d55;
    --danger: #e0483a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--ink);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  ::selection { background: var(--accent); color: #fff; }

  .sidebar {
    width: 280px; flex-shrink: 0; background: var(--ink); color: #fff;
    display: flex; flex-direction: column; height: 100%;
  }
  .sidebar-logo { padding: 20px 20px 16px; display: flex; align-items: center; gap: 10px; }
  .sidebar-logo img { height: 22px; width: auto; display: block; }
  .sidebar-logo-tag {
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-muted);
    letter-spacing: 0.06em; text-transform: uppercase; border-left: 1px solid var(--ink-line); padding-left: 10px;
  }
  .new-chat-btn {
    margin: 4px 16px 14px; padding: 10px 14px; border-radius: 10px; background: #17171a;
    border: 1px solid var(--ink-line); color: #fff; font-family: 'Inter', sans-serif;
    font-size: 13px; font-weight: 500; cursor: pointer; display: flex; align-items: center; gap: 8px;
    transition: border-color 0.15s, background 0.15s;
  }
  .new-chat-btn:hover { border-color: var(--accent); background: #1c1c22; }
  .new-chat-btn .flag { width: 9px; height: 9px; background: var(--accent); flex-shrink: 0; clip-path: polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%); }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 10px 10px; }
  .chat-list::-webkit-scrollbar { width: 6px; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--ink-line); border-radius: 3px; }
  .chat-item {
    padding: 10px 12px; border-radius: 9px; cursor: pointer; margin-bottom: 2px;
    display: flex; align-items: flex-start; gap: 9px; position: relative; transition: background 0.12s;
  }
  .chat-item:hover { background: #16161a; }
  .chat-item.active { background: #1a1c2e; }
  .chat-item .flag {
    width: 7px; height: 7px; margin-top: 5px; flex-shrink: 0; background: var(--ink-muted);
    clip-path: polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%);
  }
  .chat-item.active .flag { background: var(--accent); }
  .chat-item-text { flex: 1; min-width: 0; }
  .chat-item-title { font-size: 13px; font-weight: 500; color: #e8e7e3; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item-preview { font-size: 11.5px; color: var(--ink-muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-item-delete {
    opacity: 0; width: 20px; height: 20px; border-radius: 5px; border: none; background: transparent;
    color: var(--ink-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 13px; transition: opacity 0.12s, background 0.12s, color 0.12s;
  }
  .chat-item:hover .chat-item-delete { opacity: 1; }
  .chat-item-delete:hover { background: #2a2a2e; color: var(--danger); }
  .sidebar-footer {
    padding: 14px 20px 18px; border-top: 1px solid var(--ink-line);
    font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--ink-muted); letter-spacing: 0.03em;
  }

  .main { flex: 1; display: flex; flex-direction: column; background: var(--paper); height: 100%; min-width: 0; }
  .topbar {
    padding: 16px 28px; border-bottom: 1px solid var(--line); display: flex;
    align-items: center; justify-content: space-between; flex-shrink: 0; background: #fff;
  }
  .topbar-title { font-family: 'Space Grotesk', sans-serif; font-size: 16px; font-weight: 600; color: var(--text); }
  .topbar-sub { font-size: 11.5px; color: var(--text-muted); margin-top: 1px; }
  .topbar-controls { display: flex; align-items: center; gap: 12px; }
  .model-select {
    font-family: 'Inter', sans-serif; font-size: 12.5px; padding: 6px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--surface); color: var(--text); cursor: pointer;
  }
  .debug-toggle { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted); cursor: pointer; user-select: none; }
  .debug-toggle input { accent-color: var(--accent); }

  .messages { flex: 1; overflow-y: auto; padding: 28px 28px 10px; display: flex; flex-direction: column; gap: 18px; }
  .messages-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--text-muted); gap: 10px; text-align: center; }
  .messages-empty .flag-big { width: 26px; height: 26px; background: var(--accent); clip-path: polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%); margin-bottom: 4px; }
  .messages-empty-title { font-family: 'Space Grotesk', sans-serif; font-size: 15px; font-weight: 600; color: var(--text); }
  .messages-empty-sub { font-size: 13px; max-width: 320px; line-height: 1.5; }

  .msg-row { display: flex; gap: 11px; max-width: 78%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-row.bot { align-self: flex-start; }
  .avatar { width: 28px; height: 28px; border-radius: 8px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .avatar.bot { background: var(--ink); }
  .avatar.bot .flag { width: 8px; height: 8px; background: #fff; clip-path: polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%); }
  .avatar.user { background: var(--surface); border: 1px solid var(--line); font-size: 11px; font-weight: 600; color: var(--text-muted); }

  .bubble { padding: 11px 15px; border-radius: 13px; font-size: 13.5px; line-height: 1.6; white-space: pre-line; }
  .bubble.bot { background: #fff; border: 1px solid var(--line); color: var(--text); }
  .bubble.user { background: var(--ink); color: #fff; }
  .model-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
  .sources { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .source-tag {
    font-size: 11px; padding: 4px 10px; border-radius: 20px; background: var(--surface);
    border: 1px solid var(--line); color: var(--text-muted); text-decoration: none; transition: border-color 0.12s, color 0.12s;
  }
  .source-tag:hover { border-color: var(--accent); color: var(--accent); }
  .file-tag {
    display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--line); padding: 4px 10px; border-radius: 20px; margin-top: 6px;
  }
  .debug-link { font-size: 11px; color: var(--accent); cursor: pointer; margin-top: 7px; display: inline-block; }
  .debug-panel {
    margin-top: 6px; background: var(--ink); color: #d8d7d3; border-radius: 9px; padding: 12px;
    font-family: 'JetBrains Mono', monospace; font-size: 10.5px; white-space: pre-wrap;
    max-width: 520px; max-height: 320px; overflow-y: auto; display: none;
  }
  .debug-panel.show { display: block; }
  .thinking { display: flex; align-items: center; gap: 7px; padding: 9px 0; }
  .thinking .flag { width: 7px; height: 7px; background: var(--accent); clip-path: polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%); animation: flagPulse 1s ease-in-out infinite; }
  .thinking .flag:nth-child(2) { animation-delay: 0.15s; }
  .thinking .flag:nth-child(3) { animation-delay: 0.3s; }
  @keyframes flagPulse { 0%, 100% { opacity: 0.25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-2px); } }

  .input-area { padding: 14px 28px 20px; border-top: 1px solid var(--line); background: #fff; flex-shrink: 0; }
  .file-preview {
    display: none; align-items: center; gap: 8px; font-size: 12px; color: var(--text);
    background: var(--accent-soft); border: 1px solid #c7cdfb; border-radius: 9px; padding: 8px 12px; margin-bottom: 10px;
  }
  .file-preview.show { display: flex; }
  .file-preview .remove-file { margin-left: auto; cursor: pointer; color: var(--text-muted); background: none; border: none; font-size: 14px; }
  .input-row { display: flex; gap: 8px; align-items: center; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
    color: var(--text-muted); cursor: pointer; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 17px; transition: border-color 0.12s, color 0.12s;
  }
  .icon-btn:hover { border-color: var(--accent); color: var(--accent); }
  .text-input { flex: 1; height: 38px; border-radius: 10px; border: 1px solid var(--line); padding: 0 14px; font-size: 13.5px; font-family: 'Inter', sans-serif; outline: none; }
  .text-input:focus { border-color: var(--accent); }
  .send-btn { width: 38px; height: 38px; border-radius: 10px; border: none; background: var(--ink); color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .send-btn:hover { background: #232323; }
  .send-btn .flag { width: 10px; height: 10px; background: var(--accent); clip-path: polygon(30% 0%, 100% 0%, 70% 100%, 0% 100%); }
  .input-meta { font-size: 10.5px; color: var(--text-muted); margin-top: 8px; font-family: 'JetBrains Mono', monospace; }

  /* ===== LOGIN SCREEN ===== */
  #loginScreen {
    display: none;
    position: fixed; inset: 0; background: var(--ink); align-items: center; justify-content: center; z-index: 100;
  }
  .login-card { width: 340px; text-align: center; }
  .login-card img { height: 30px; margin-bottom: 28px; }
  .login-card h1 { font-family: 'Space Grotesk', sans-serif; font-size: 17px; color: #fff; font-weight: 600; margin-bottom: 6px; }
  .login-card p { font-size: 12.5px; color: var(--ink-muted); margin-bottom: 26px; }
  .login-field { text-align: left; margin-bottom: 12px; }
  .login-field label { font-size: 11px; color: var(--ink-muted); display: block; margin-bottom: 5px; }
  .login-field input {
    width: 100%; height: 40px; border-radius: 9px; border: 1px solid var(--ink-line);
    background: #131315; color: #fff; padding: 0 13px; font-size: 13.5px; font-family: 'Inter', sans-serif; outline: none;
  }
  .login-field input:focus { border-color: var(--accent); }
  .login-btn {
    width: 100%; height: 42px; border-radius: 9px; border: none; background: var(--accent);
    color: #fff; font-size: 13.5px; font-weight: 600; cursor: pointer; margin-top: 8px; font-family: 'Inter', sans-serif;
  }
  .login-btn:hover { background: #2f3fd6; }
  .login-error { color: #ff6b5e; font-size: 12px; margin-top: 12px; min-height: 16px; }
  .app-shell { display: none; }
  .app-shell.show { display: flex; width: 100%; height: 100%; }
  .user-badge {
    display: flex; align-items: center; gap: 8px; padding: 10px 12px; margin: 6px 10px 0;
    border-top: 1px solid var(--ink-line); padding-top: 12px;
  }
  .user-badge-avatar {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent-soft); color: var(--accent);
    display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex-shrink: 0;
  }
  .user-badge-name { font-size: 12.5px; color: #e8e7e3; font-weight: 500; }
  .user-badge-role { font-size: 10.5px; color: var(--ink-muted); }
  .logout-btn { margin-left: auto; background: none; border: none; color: var(--ink-muted); cursor: pointer; font-size: 12px; }
  .logout-btn:hover { color: var(--danger); }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <img src="/static/logo.png" alt="Райтек">
    <h1>ИИ-ассистент</h1>
    <p>Войдите чтобы продолжить</p>
    <div class="login-field">
      <label>Логин</label>
      <input type="text" id="loginUsername" onkeydown="if(event.key==='Enter') document.getElementById('loginPassword').focus()">
    </div>
    <div class="login-field">
      <label>Пароль</label>
      <input type="password" id="loginPassword" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
    <button class="login-btn" onclick="doLogin()">Войти</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div class="app-shell" id="appShell">
<div class="sidebar">
  <div class="sidebar-logo">
    <img src="/static/logo.png" alt="Райтек">
    <span class="sidebar-logo-tag">ИИ-ассистент</span>
  </div>
  <button class="new-chat-btn" onclick="createChat()">
    <span class="flag"></span> Новый чат
  </button>
  <div class="chat-list" id="chatList"></div>
  <a href="/admin" id="adminLink" style="display:none; margin: 0 10px 8px; padding: 9px 12px; border-radius: 9px; font-size: 12.5px; color: #d5d4cf; text-decoration: none; border: 1px solid var(--ink-line); align-items: center; gap: 8px;">
    <span class="flag"></span> Админ-панель
  </a>
  <div class="user-badge">
    <div class="user-badge-avatar" id="userAvatar">?</div>
    <div>
      <div class="user-badge-name" id="userName">—</div>
      <div class="user-badge-role" id="userRole">—</div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Выйти</button>
  </div>
  <div class="sidebar-footer">КОРП СТП · Корпоративная база знаний</div>
</div>

<div class="main">
  <div class="topbar">
    <div>
      <div class="topbar-title" id="chatTitle">Новый чат</div>
      <div class="topbar-sub">Внутренний ИИ-ассистент по базе знаний</div>
    </div>
    <div class="topbar-controls">
      <select id="modeSelect" class="model-select">
        <option value="kb_only">Строго по базе знаний</option>
        <option value="combined">Комбинированный</option>
        <option value="external">Внешняя LLM</option>
      </select>
      <select id="modelSelect" class="model-select">
        <option value="gigachat">GigaChat</option>
        <option value="qwen">Qwen</option>
      </select>
      <label class="debug-toggle">
        <input type="checkbox" id="debugMode"> Debug
      </label>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <div class="file-preview" id="filePreview">
      <span id="filePreviewName"></span>
      <button class="remove-file" onclick="removeFile()">✕</button>
    </div>
    <div class="input-row">
      <input type="file" id="fileInput" style="display:none" accept=".txt,.pdf,.docx" onchange="handleFileSelect(event)">
      <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить файл">+</button>
      <input type="text" id="chatInput" class="text-input" placeholder="Напишите вопрос..." onkeydown="if(event.key==='Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()"><span class="flag"></span></button>
    </div>
    <div class="input-meta" id="inputMeta">GigaChat · КОРП СТП + Корпоративная база знаний</div>
  </div>
</div>
</div>

<script>
let chats = JSON.parse(localStorage.getItem('raytec_chats') || '[]');
let activeChatId = localStorage.getItem('raytec_active_chat');
let isThinking = false;
let attachedFile = null;

function saveChats() {
  localStorage.setItem('raytec_chats', JSON.stringify(chats));
  localStorage.setItem('raytec_active_chat', activeChatId);
}

function init() {
  if (chats.length === 0) {
    createChat(false);
  } else if (!activeChatId || !chats.find(c => c.id === activeChatId)) {
    activeChatId = chats[0].id;
  }
  renderChatList();
  renderMessages();
  updateInputMeta();
}

function createChat(render = true) {
  const id = 'chat_' + Date.now();
  chats.unshift({ id, title: 'Новый чат', messages: [] });
  activeChatId = id;
  saveChats();
  if (render) { renderChatList(); renderMessages(); }
}

function switchChat(id) {
  activeChatId = id;
  attachedFile = null;
  updateFilePreview();
  saveChats();
  renderChatList();
  renderMessages();
}

function deleteChat(id, event) {
  event.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  if (activeChatId === id) {
    if (chats.length === 0) { createChat(); return; }
    activeChatId = chats[0].id;
  }
  saveChats();
  renderChatList();
  renderMessages();
}

function getActiveChat() {
  return chats.find(c => c.id === activeChatId);
}

function renderChatList() {
  const list = document.getElementById('chatList');
  list.innerHTML = '';
  chats.forEach(c => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === activeChatId ? ' active' : '');
    const preview = c.messages.length ? c.messages[c.messages.length - 1].content.slice(0, 40) : 'Пока пусто';
    div.innerHTML = `<span class="flag"></span><div class="chat-item-text"><div class="chat-item-title">${escapeHtml(c.title)}</div><div class="chat-item-preview">${escapeHtml(preview)}</div></div><button class="chat-item-delete" onclick="deleteChat('${c.id}', event)">✕</button>`;
    div.onclick = () => switchChat(c.id);
    list.appendChild(div);
  });
}

function renderMessages() {
  const chat = getActiveChat();
  document.getElementById('chatTitle').textContent = chat.title;
  const messages = document.getElementById('messages');
  messages.innerHTML = '';

  if (chat.messages.length === 0) {
    messages.innerHTML = `<div class="messages-empty"><div class="flag-big"></div><div class="messages-empty-title">Задайте вопрос по базе знаний</div><div class="messages-empty-sub">Кадровые вопросы, регламенты, работа с заявками — я отвечу на основе корпоративной базы знаний Райтек.</div></div>`;
    return;
  }

  chat.messages.forEach(m => {
    if (m.role === 'user') {
      messages.appendChild(renderUserMsg(m.content, m.fileAttached));
    } else {
      messages.appendChild(renderBotMsg(m.content, m.sources, m.debug, m.modelUsed));
    }
  });
  messages.scrollTop = messages.scrollHeight;
}

function renderUserMsg(text, fileAttached) {
  const div = document.createElement('div');
  div.className = 'msg-row user';
  let fileHtml = fileAttached ? `<div class="file-tag">📎 ${escapeHtml(fileAttached)}</div>` : '';
  div.innerHTML = `<div class="avatar user">Я</div><div><div class="bubble user">${escapeHtml(text)}</div>${fileHtml}</div>`;
  return div;
}

function renderBotMsg(text, sources, debug, modelUsed) {
  const div = document.createElement('div');
  div.className = 'msg-row bot';
  let sourcesHtml = '';
  if (sources && sources.length) {
    sourcesHtml = '<div class="sources">' + sources.map(s => {
      const label = `📄 ${escapeHtml(s.title)}`;
      return s.url ? `<a class="source-tag" href="${s.url}" target="_blank" rel="noopener">${label}</a>` : `<span class="source-tag">${label}</span>`;
    }).join('') + '</div>';
  }
  let modelTag = modelUsed ? `<div class="model-tag">${escapeHtml(modelUsed)}</div>` : '';
  let anonTag = (debug && debug.anonymization_applied) ? `<div class="model-tag" style="color:var(--success)">🔒 обезличено перед отправкой</div>` : '';
  let debugHtml = '';
  const debugOn = document.getElementById('debugMode').checked;
  if (debugOn && debug) {
    const debugId = 'debug-' + Date.now() + Math.random().toString(36).slice(2);
    debugHtml = `<div class="debug-link" onclick="document.getElementById('${debugId}').classList.toggle('show')">Показать путь обработки</div><div class="debug-panel" id="${debugId}">${escapeHtml(JSON.stringify(debug, null, 2))}</div>`;
  }
  div.innerHTML = `<div class="avatar bot"><span class="flag"></span></div><div>${modelTag}${anonTag}<div class="bubble bot">${escapeHtml(text)}</div>${sourcesHtml}${debugHtml}</div>`;
  return div;
}

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const question = input.value.trim();
  if (!question || isThinking) return;
  input.value = '';

  const chat = getActiveChat();
  if (chat.messages.length === 0) {
    chat.title = question.slice(0, 32);
  }

  const fileAttachedLabel = attachedFile ? attachedFile.filename : null;
  chat.messages.push({ role: 'user', content: question, fileAttached: fileAttachedLabel });
  saveChats();
  renderChatList();
  renderMessages();

  isThinking = true;
  const messages = document.getElementById('messages');
  const thinkingEl = document.createElement('div');
  thinkingEl.className = 'msg-row bot';
  thinkingEl.id = 'thinkingRow';
  thinkingEl.innerHTML = `<div class="avatar bot"><span class="flag"></span></div><div class="thinking"><span class="flag"></span><span class="flag"></span><span class="flag"></span></div>`;
  messages.appendChild(thinkingEl);
  messages.scrollTop = messages.scrollHeight;

  const history = chat.messages.slice(0, -1).map(m => ({ role: m.role, content: m.content }));

  try {
    const response = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question,
        model: document.getElementById('modelSelect').value,
        mode: document.getElementById('modeSelect').value,
        history,
        file_text: attachedFile ? attachedFile.text : null
      })
    });
    const data = await response.json();
    document.getElementById('thinkingRow')?.remove();

    if (data.error) {
      chat.messages.push({ role: 'bot', content: 'Произошла ошибка: ' + data.error, sources: [] });
    } else {
      chat.messages.push({ role: 'bot', content: data.answer, sources: data.sources || [], debug: data.debug, modelUsed: data.model_used });
    }
  } catch (err) {
    document.getElementById('thinkingRow')?.remove();
    chat.messages.push({ role: 'bot', content: 'Не удалось связаться с сервером. Попробуйте ещё раз.', sources: [] });
  }

  isThinking = false;
  attachedFile = null;
  updateFilePreview();
  saveChats();
  renderChatList();
  renderMessages();
}

async function handleFileSelect(event) {
  const file = event.target.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append('file', file);

  const preview = document.getElementById('filePreview');
  const nameEl = document.getElementById('filePreviewName');
  nameEl.textContent = `Загружаю ${file.name}...`;
  preview.classList.add('show');

  try {
    const response = await fetch('/api/upload', { method: 'POST', body: formData });
    const data = await response.json();
    if (data.error) {
      nameEl.textContent = 'Ошибка: ' + data.error;
      setTimeout(() => { preview.classList.remove('show'); }, 3000);
      return;
    }
    attachedFile = { filename: data.filename, text: data.text };
    nameEl.textContent = `📎 ${data.filename} (${data.chars} симв.)`;
  } catch (err) {
    nameEl.textContent = 'Не удалось загрузить файл';
    setTimeout(() => { preview.classList.remove('show'); }, 3000);
  }
  event.target.value = '';
}

function removeFile() {
  attachedFile = null;
  updateFilePreview();
}

function updateFilePreview() {
  document.getElementById('filePreview').classList.remove('show');
}

function updateInputMeta() {
  const modelSel = document.getElementById('modelSelect');
  const modeSel = document.getElementById('modeSelect');
  const meta = document.getElementById('inputMeta');
  const update = () => { meta.textContent = `${modelSel.options[modelSel.selectedIndex].text} · ${modeSel.options[modeSel.selectedIndex].text}`; };
  modelSel.addEventListener('change', update);
  modeSel.addEventListener('change', update);
  update();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : text;
  return div.innerHTML;
}

async function checkSession() {
  try {
    const res = await fetch('/api/session');
    const data = await res.json();
    if (data.authenticated) {
      showApp(data);
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
    }
  } catch (e) {
    document.getElementById('loginScreen').style.display = 'flex';
  }
}

function showApp(userData) {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('appShell').classList.add('show');
  document.getElementById('userName').textContent = userData.display_name;
  document.getElementById('userRole').textContent = userData.role === 'admin' ? 'Администратор' : 'Пользователь';
  document.getElementById('userAvatar').textContent = userData.display_name.slice(0, 2).toUpperCase();
  if (userData.role === 'admin') {
    document.getElementById('adminLink').style.display = 'flex';
  }
  init();
}

async function doLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';

  if (!username || !password) {
    errorEl.textContent = 'Введите логин и пароль';
    return;
  }

  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (data.error) {
      errorEl.textContent = data.error;
      return;
    }
    showApp(data);
  } catch (e) {
    errorEl.textContent = 'Не удалось связаться с сервером';
  }
}

async function doLogout() {
  await fetch('/api/logout', { method: 'POST' });
  document.getElementById('appShell').classList.remove('show');
  document.getElementById('loginScreen').style.display = 'flex';
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
}

checkSession();
</script>
